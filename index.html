
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DIGEST by Miaina L.</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="index.css?v=2.0">

</head>

<body>

  <main class="container">

    <!-- HEADER -->
    <header class="page-header">
      <h1 class="mainTitle">Digest</h1>
      <p class="subTitle">word&nbsp;randomiser</p>
    </header>


    <!-- MAIN CONTENT -->
    <section class="main-layout">


      <!-- LEFT PANEL -->
      <div class="input-panel">

        <div class="panel-heading">
          <h2>Your Words</h2>
          <p>Enter one word per line.</p>
        </div>


        <!-- MODE SELECTION -->
        <div class="mode-section">

          <label for="modeSelect">Randomiser Mode</label>

          <select id="modeSelect" onchange="setMode(this.value)">
            <option value="normal">Normal Randomiser</option>
            <option value="study">Study Mode</option>
          </select>

        </div>


        <!-- WORD INPUT -->
        <div id="inputSection">

          <textarea
            id="wordInput"
            placeholder="Enter your words here..."
          ></textarea>

          <div class="input-actions">

            <button id="saveWordsBtn" onclick="saveWords()">
              Save Set
            </button>
          
            <button id="savedWordsBtn" onclick="openSavedUI()">
              Saved Words
            </button>
          
            <button id="clearWordsBtn" onclick="clearWords()">
              Clear
            </button>
          
          </div>

        </div>


        <!-- SPIN BUTTON -->
        <button id="spinBtn" onclick="handleSpin()">
          SPIN
        </button>


        <!-- TIMER BUTTON -->
        <button id="startTimerBtn" onclick="goToTimer()">
          START TIMER
        </button>

      </div>


      <!-- RIGHT PANEL -->
      <div class="wheel-panel">

        <div id="wheelContainer">

          <canvas id="wheelCanvas" width="600" height="600"></canvas>

          <div id="pointer"></div>

        </div>


        <!-- SELECTED WORD -->
        <div id="selectedWord">
          Your selected word will appear here.
        </div>

      </div>

    </section>

  </main>


  <!-- SAVED WORD SETS MODAL -->
  <div id="savedUI">

    <div id="savedPanel">

      <button id="closeSavedBtn" onclick="closeSavedUI()">✕</button>

      <h2>Saved Word Sets</h2>

      <div id="savedContainer"></div>

    </div>

  </div>


  <!-- FOOTER -->
  <footer>
    © 2026 by Miaina Luz
  </footer>


  <script src="script.js?v=2.0"></script>

</body>
</html>
